<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>My Pixel Pet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 2px; } /* 基準：所有 px 字體都以此縮放，原本 7px = 14px */

  body {
    background: #0a0a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #c8c8ff;
    overflow-x: hidden;
  }

  /* ── Sidebar overlay ── */
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #00000066;
    z-index: 20;
  }
  .sidebar-overlay.show { display: block; }

  .sidebar {
    position: fixed;
    top: 0; right: -310px;
    width: 300px; height: 100%;
    background: #0e0e26;
    border-left: 2px solid #3a3a7a;
    padding: 24px 18px;
    display: flex; flex-direction: column; gap: 20px;
    transition: right 0.3s ease;
    z-index: 21;
  }
  .sidebar.open { right: 0; }

  .sidebar-title { font-size: 4rem; color: #6666bb; letter-spacing: 2px; }

  .sidebar-section { display: flex; flex-direction: column; gap: 8px; }
  .sidebar-label { font-size: 3rem; color: #5555aa; margin-bottom: 2px; }

  .name-input {
    background: #1a1a3a;
    border: 1px solid #3a3a6a;
    border-radius: 6px;
    color: #c8c8ff;
    font-family: 'Press Start 2P', monospace;
    font-size: 3.5rem;
    padding: 8px 10px;
    width: 100%;
    outline: none;
  }
  .name-input:focus { border-color: #7777cc; }

  .side-btn {
    background: #1c1c42;
    border: 1.5px solid #3a3a7a;
    border-radius: 8px;
    color: #aaaaee;
    font-family: 'Press Start 2P', monospace;
    font-size: 3.5rem;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
  }
  .side-btn:hover { background: #2a2a5e; }
  .side-btn.danger { border-color: #884444; color: #ff9999; }
  .side-btn.danger:hover { background: #2a1010; }

  .sidebar-close {
    margin-top: auto;
    background: none;
    border: 1px solid #2a2a5a;
    border-radius: 6px;
    color: #5555aa;
    font-family: 'Press Start 2P', monospace;
    font-size: 3.5rem;
    padding: 8px;
    cursor: pointer;
    text-align: center;
  }

  /* ── Main game ── */
  .game {
    background: #12122a;
    border: 3px solid #3a3a7a;
    border-radius: 16px;
    width: min(520px, 96vw);
    padding: 20px 18px 24px;
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    box-shadow: 0 0 40px #2a2a6a44;
    position: relative;
  }

  .top-bar {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pet-name { font-size: 4.5rem; color: #9999dd; }
  .menu-btn {
    background: none; border: 1.5px solid #3a3a6a;
    border-radius: 6px; color: #6666aa;
    font-family: 'Press Start 2P', monospace;
    font-size: 4rem; padding: 5px 8px;
    cursor: pointer; transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-btn:hover { background: #1c1c42; }

  .pet-area {
    background: #07071a;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  canvas#pet { image-rendering: pixelated; }
  .zzz {
    position: absolute; top: 10px; right: 14px;
    font-size: 4rem; color: #aaaaff;
    opacity: 0; transition: opacity 0.5s; pointer-events: none;
  }
  .zzz.visible { opacity: 1; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  /* Stats */
  .stats { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .stat-row { display: flex; align-items: center; gap: 8px; font-size: 3.5rem; }
  .stat-label { color: #7777bb; width: 56px; flex-shrink: 0; }
  .bar-bg {
    flex: 1; height: 10px; background: #1e1e3e;
    border-radius: 3px; overflow: hidden; border: 1px solid #2a2a5a;
  }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .bar-fill.hunger { background: #ff7070; }
  .bar-fill.happy  { background: #ffd060; }
  .bar-fill.energy { background: #60cc80; }
  .bar-fill.water  { background: #60c0ff; }
  .stat-val { font-size: 3.5rem; color: #6666aa; width: 44px; text-align: right; }

  /* Buttons */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; width: 100%; }
  .btn-grid-sleep { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 100%; }

  .btn {
    background: #1c1c42; border: 2px solid #3a3a7a; border-radius: 8px;
    color: #aaaaee; font-family: 'Press Start 2P', monospace;
    font-size: 3.5rem; padding: 10px 4px; cursor: pointer;
    text-align: center; transition: background 0.15s, transform 0.1s;
    line-height: 1.6; -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: #2a2a5e; }
  .btn:active { transform: scale(0.95); background: #333370; }
  .btn.sleep-btn { border-color: #5555aa; color: #9999ff; }
  .btn.wake-btn  { border-color: #aa9900; color: #ffdd44; }
  .btn.water-btn { border-color: #2266aa; color: #60c0ff; }
  .btn:disabled  { opacity: 0.35; cursor: not-allowed; transform: none; }

  .status {
    font-size: 3.5rem; color: #6666aa;
    text-align: center; min-height: 12px; line-height: 1.8;
  }

  .divider { width: 100%; border: none; border-top: 1px solid #2a2a5a; }

  /* Sleep log */
  .log-title { font-size: 3.5rem; color: #5555aa; letter-spacing: 1px; align-self: flex-start; }
  .log-list {
    width: 100%; display: flex; flex-direction: column;
    gap: 5px; max-height: 110px; overflow-y: auto;
  }
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 2px; }
  .log-entry {
    background: #0e0e28; border: 1px solid #222248;
    border-radius: 5px; padding: 6px 8px;
    font-size: 3rem; color: #7777bb;
    line-height: 1.8; display: flex; flex-direction: column; gap: 2px;
  }
  .log-entry .duration { color: #aaaaee; }
  .no-log { font-size: 3rem; color: #3a3a6a; text-align: center; padding: 8px 0; }

  /* Confirm dialog */
  .confirm-overlay {
    display: none; position: fixed; inset: 0;
    background: #00000099; align-items: center;
    justify-content: center; z-index: 30;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-box {
    background: #12122a; border: 2px solid #884444;
    border-radius: 12px; padding: 24px 20px;
    display: flex; flex-direction: column;
    align-items: center; gap: 12px; width: 260px;
  }
  .confirm-box p { font-size: 3.5rem; color: #aaaacc; line-height: 2; text-align: center; }
  .confirm-btns { display: flex; gap: 8px; width: 100%; }
  .confirm-btns button {
    flex: 1; font-family: 'Press Start 2P', monospace;
    font-size: 3.5rem; padding: 9px 4px; border-radius: 6px; cursor: pointer;
  }
  .confirm-yes { background: #2a0a0a; border: 1.5px solid #ff4444; color: #ff8888; }
  .confirm-no  { background: #1c1c42; border: 1.5px solid #3a3a7a; color: #aaaaee; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-title">⚙ SETTINGS</div>

  <div class="sidebar-section">
    <div class="sidebar-label">— 修改名字 —</div>
    <input class="name-input" id="name-input" type="text" maxlength="12" placeholder="輸入新名字">
    <button class="side-btn" onclick="saveName()">✔ 儲存名字</button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">— 危險區域 —</div>
    <button class="side-btn danger" onclick="confirmReset()">↺ 重置遊戲</button>
  </div>

  <button class="sidebar-close" onclick="closeSidebar()">✕ 關閉</button>
</div>

<!-- Main -->
<div class="game">
  <div class="top-bar">
    <div class="pet-name" id="pet-name">My Pet</div>
    <button class="menu-btn" onclick="openSidebar()">☰</button>
  </div>

  <div class="pet-area">
    <canvas id="pet" width="80" height="80"></canvas>
    <div class="zzz" id="zzz">z z z</div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">飢餓</span>
      <div class="bar-bg"><div class="bar-fill hunger" id="bar-hunger"></div></div>
      <span class="stat-val" id="val-hunger">70</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">快樂</span>
      <div class="bar-bg"><div class="bar-fill happy" id="bar-happy"></div></div>
      <span class="stat-val" id="val-happy">85</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">體力</span>
      <div class="bar-bg"><div class="bar-fill energy" id="bar-energy"></div></div>
      <span class="stat-val" id="val-energy">40</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">水分</span>
      <div class="bar-bg"><div class="bar-fill water" id="bar-water"></div></div>
      <span class="stat-val" id="val-water">60</span>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn" id="btn-feed"  onclick="feed()">🍖<br>餵食</button>
    <button class="btn" id="btn-play"  onclick="play()">🎾<br>玩耍</button>
    <button class="btn water-btn" id="btn-water" onclick="drink()">💧<br>喝水</button>
  </div>

  <hr class="divider">

  <div class="btn-grid-sleep">
    <button class="btn sleep-btn" id="btn-sleep" onclick="goSleep()">🌙<br>睡覺</button>
    <button class="btn wake-btn"  id="btn-wake"  onclick="wakeUp()" disabled>☀️<br>起床</button>
  </div>

  <div class="status" id="status">寵物正在等你陪牠玩...</div>

  <hr class="divider">

  <div class="log-title">— 睡眠紀錄 —</div>
  <div class="log-list" id="log-list">
    <div class="no-log" id="no-log">還沒有紀錄</div>
  </div>
</div>

<!-- Confirm reset dialog -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p>確定要重置遊戲嗎？<br>寵物數值會歸零<br>睡眠紀錄會保留。</p>
    <div class="confirm-btns">
      <button class="confirm-yes" onclick="doReset()">確定</button>
      <button class="confirm-no"  onclick="closeConfirm()">取消</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('pet');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const S = 5;
const SAVE_KEY = 'pixelpet_v2';

function defaultState() {
  return {
    name: 'My Pet',
    hunger: 70, happy: 85, energy: 40, water: 60,
    sleeping: false, sleepStart: null,
    dead: false, gameOver: false,
    logs: [], lastTick: Date.now()
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    if (s.sleepStart) s.sleepStart = Number(s.sleepStart);
    if (!s.lastTick) s.lastTick = Date.now();
    if (!s.logs) s.logs = [];
    if (s.water === undefined) s.water = 60;
    if (s.dead === undefined) s.dead = false;
    return s;
  } catch(e) { return defaultState(); }
}

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();

// 離線衰減補算（每小時：hunger -5, happy -3, energy -2, water -4）
function applyOfflineDecay() {
  if (state.dead || state.sleeping) return;
  const hrs = (Date.now() - state.lastTick) / 3600000;
  if (hrs < 0.001) return;
  state.hunger = clamp(state.hunger - hrs * 5);
  state.happy  = clamp(state.happy  - hrs * 3);
  state.energy = clamp(state.energy - hrs * 2);
  state.water  = clamp(state.water  - hrs * 4);
  state.lastTick = Date.now();
}

function clamp(v) { return Math.max(0, Math.min(100, v)); }

// ── 繪製寵物 ──
function drawPet() {
  ctx.clearRect(0, 0, 80, 80);
  if (state.dead) { drawGrave(); return; }
  const sleeping = state.sleeping;
  const d = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x*S,y*S,w*S,h*S); };
  const skin='#ffcc88', dark='#333', white='#fff',
        mouth='#cc6644', blush='rgba(255,160,160,0.6)';
  d(2,1,2,3,skin); d(12,1,2,3,skin);
  d(2,3,12,8,skin);
  if (sleeping) {
    ctx.fillStyle = dark;
    ctx.fillRect(5*S,5*S+2,2*S,2);
    ctx.fillRect(9*S,5*S+2,2*S,2);
  } else {
    d(5,5,2,2,dark); d(9,5,2,2,dark);
    d(5,5,1,1,white); d(9,5,1,1,white);
  }
  if (sleeping) { d(7,8,2,1,mouth); }
  else          { d(6,8,1,1,mouth); d(7,9,2,1,mouth); d(9,8,1,1,mouth); }
  d(3,7,2,1,blush); d(11,7,2,1,blush);
  d(4,11,8,4,skin);
  d(4,14,2,2,skin); d(10,14,2,2,skin);
}

function drawGrave() {
  const d = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x*S,y*S,w*S,h*S); };
  const stone = '#7a7a9a', dark = '#4a4a6a', grass = '#336633', soil = '#553322';
  // 草地
  d(1,14,14,2,grass);
  // 土堆
  d(3,13,10,1,soil);
  // 墓碑
  d(5,4,6,10,stone);
  d(4,6,1,8,stone); d(11,6,1,8,stone);
  d(6,3,4,2,stone);
  // 十字
  d(7,5,2,6,dark);
  d(5,7,6,2,dark);
  // 墓碑陰影
  d(11,5,1,9,dark);
}

// ── UI ──
function updateUI() {
  const s = state;
  document.getElementById('pet-name').textContent = s.name || 'My Pet';
  ['hunger','happy','energy','water'].forEach(k => {
    const v = Math.max(0, Math.min(100, Math.round(s[k])));
    document.getElementById('bar-'+k).style.width = v+'%';
    document.getElementById('val-'+k).textContent = v;
  });
  document.getElementById('zzz').classList.toggle('visible', s.sleeping && !s.dead);
  const asleep = s.sleeping || s.dead;
  document.getElementById('btn-sleep').disabled = asleep;
  document.getElementById('btn-wake').disabled  = !s.sleeping || s.dead;
  ['btn-feed','btn-play','btn-water'].forEach(id => {
    document.getElementById(id).disabled = s.sleeping || s.dead;
  });
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function save() { state.lastTick = Date.now(); saveState(); }

// ── Actions ──
function feed() {
  if (state.sleeping || state.dead) return;
  state.hunger = clamp(state.hunger + 20);
  state.happy  = clamp(state.happy  + 5);
  setStatus('吃得很開心！nyam nyam~');
  save(); updateUI(); drawPet();
}

function play() {
  if (state.sleeping || state.dead) return;
  if (state.energy < 10) { setStatus('太累了，先讓牠睡覺吧...'); return; }
  state.happy  = clamp(state.happy  + 20);
  state.energy = clamp(state.energy - 15);
  state.hunger = clamp(state.hunger - 10);
  setStatus('玩得超開心！');
  save(); updateUI(); drawPet();
}

function drink() {
  if (state.sleeping || state.dead) return;
  state.water = clamp(state.water + 10);
  setStatus('咕嚕咕嚕～補充水分！');
  save(); updateUI(); drawPet();
}

function goSleep() {
  if (state.sleeping || state.dead) return;
  state.sleeping  = true;
  state.sleepStart = Date.now();
  setStatus('🌙 晚安！記得按起床紀錄睡眠');
  save(); updateUI(); drawPet();
}

function wakeUp() {
  if (!state.sleeping) return;
  const now  = Date.now();
  const diff = now - state.sleepStart;
  const hrs  = Math.floor(diff / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const totalHrs = diff / 3600000;

  // 睡一小時體力 +15，最多補到 100
  state.energy   = clamp(state.energy + totalHrs * 15);
  state.sleeping  = false;
  state.lastTick  = now;

  const sleepDate = new Date(state.sleepStart);
  const wakeDate  = new Date(now);
  state.logs.unshift({
    date: sleepDate.toLocaleDateString('zh-TW'),
    sleep: fmt(sleepDate), wake: fmt(wakeDate),
    duration: hrs + '小時 ' + mins + '分鐘'
  });
  renderLog();
  setStatus('早安！睡了 ' + hrs + ' 小時 ' + mins + ' 分');
  save(); updateUI(); drawPet();
}

function fmt(d) {
  return d.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
}

function renderLog() {
  const list = document.getElementById('log-list');
  document.getElementById('no-log').style.display = state.logs.length ? 'none' : 'block';
  list.querySelectorAll('.log-entry').forEach(e => e.remove());
  state.logs.slice(0,10).forEach(e => {
    const el = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML = `<span>${e.date}　${e.sleep} → ${e.wake}</span><span class="duration">睡眠時間：${e.duration}</span>`;
    list.appendChild(el);
  });
}

function checkDeath() {
  if (state.dead || state.sleeping) return;
  if (state.hunger <= 0 && state.energy <= 0) {
    state.dead = true;
    setStatus('💀 ' + (state.name||'寵物') + ' 離開了...');
    save(); updateUI(); drawPet();
  }
}

// ── Sidebar ──
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('show');
  document.getElementById('name-input').value = state.name || '';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}
function saveName() {
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  state.name = val;
  save(); updateUI();
  setStatus('名字改成 ' + val + ' 了！');
  closeSidebar();
}

// ── Reset ──
function confirmReset() {
  closeSidebar();
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
}
function doReset() {
  const logs = state.logs;
  const name = state.name;
  state = defaultState();
  state.logs = logs;
  state.name = name;
  closeConfirm();
  setStatus('重新開始！寵物很開心～');
  save(); renderLog(); updateUI(); drawPet();
}

// 每 5 分鐘衰減（開著視窗時）
setInterval(() => {
  if (state.dead || state.sleeping) return;
  const f = 1/12; // 1/12 小時 = 5 分鐘
  state.hunger = clamp(state.hunger - 5*f);
  state.happy  = clamp(state.happy  - 3*f);
  state.energy = clamp(state.energy - 2*f);
  state.water  = clamp(state.water  - 4*f);
  save(); updateUI(); checkDeath();
}, 5 * 60 * 1000);

// 初始化
applyOfflineDecay();
checkDeath();
renderLog();
updateUI();
drawPet();
if (state.dead)          setStatus('💀 ' + (state.name||'寵物') + ' 離開了...');
else if (state.sleeping) setStatus('🌙 寵物正在睡覺...');
else                     setStatus('嗨！我是你的像素寵物 ♥');
</script>
</body>
</html>
